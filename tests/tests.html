<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tests — galerie et compteurs</title>
</head>
<body>
<h1>Tests</h1>
<pre id="resultats">exécution…</pre>

<!-- Fixtures : même structure que index.html, contenu réduit. -->
<section id="projets">
  <div role="group">
    <button type="button" data-filter="all" aria-pressed="true">Tous</button>
    <button type="button" data-filter="cuisine" aria-pressed="false">Cuisine</button>
    <button type="button" data-filter="escalier" aria-pressed="false">Escalier</button>
  </div>
  <ul id="galerie">
    <li data-category="cuisine">c1</li>
    <li data-category="cuisine">c2</li>
    <li data-category="escalier">e1</li>
    <li data-category="porte-fenetre">p1</li>
  </ul>
</section>

<section id="chiffres">
  <ul><li><span data-counter="128">0</span></li></ul>
</section>

<!-- Fixture formulaire : les champs obligatoires d'index.html. -->
<form id="contact-form">
  <input type="text" name="nom" required>
  <input type="text" name="prenom" required>
  <input type="email" name="email" required>
  <input type="tel" name="telephone" required>
  <input type="checkbox" name="categories" value="Cuisine">
  <textarea name="description"></textarea>
  <input type="checkbox" name="consentement" required>
  <p class="pot-de-miel"><input type="text" name="societe"></p>
  <button type="submit">Envoyer</button>
</form>
<p id="form-status"></p>

<!-- Fixture carrousel : deux diapositives dans une piste de 200px. -->
<section id="accueil">
  <ul class="diapos" style="display:flex;overflow-x:auto;width:200px">
    <li class="diapo" style="flex:0 0 200px">1</li>
    <li class="diapo" style="flex:0 0 200px">2</li>
  </ul>
  <div class="diapos-controles">
    <button type="button" data-diapo="0" aria-current="true"></button>
    <button type="button" data-diapo="1" aria-current="false"></button>
    <button type="button" class="lecture">Mettre en pause le défilement</button>
  </div>
</section>

<script src="../assets/js/hero-slider.js"></script>
<script src="../assets/js/gallery-filter.js"></script>
<script src="../assets/js/counters.js"></script>
<script>
  // contact-form.js lit performance.now() au chargement : on lui donne une
  // horloge pilotable pour tester le délai minimum sans attendre 3 secondes.
  window.horloge = 0;
  performance.now = () => window.horloge;
</script>
<script src="../assets/js/contact-form.js"></script>
<script>
const echecs = [];
function verifie(nom, condition) { if (!condition) echecs.push(nom); }

const visibles = () => [...document.querySelectorAll('#galerie li')].filter(li => !li.hidden).length;
const presse = sel => document.querySelector(sel).getAttribute('aria-pressed');

// Filtrage
document.querySelector('[data-filter="cuisine"]').click();
verifie('cuisine ne laisse que ses 2 photos', visibles() === 2);
verifie('le bouton cuisine devient actif', presse('[data-filter="cuisine"]') === 'true');
verifie('le bouton Tous redevient inactif', presse('[data-filter="all"]') === 'false');

document.querySelector('[data-filter="escalier"]').click();
verifie('changer de filtre ne cumule pas', visibles() === 1);

document.querySelector('[data-filter="all"]').click();
verifie('Tous réaffiche toutes les photos', visibles() === 4);
verifie('une catégorie sans bouton reste visible sous Tous',
  !document.querySelector('[data-category="porte-fenetre"]').hidden);

// Compteur : l'easing doit finir exactement sur la cible (pas 127 par arrondi).
// requestAnimationFrame et performance.now sont remplacés par un faux temps :
// le test reste déterministe et ne dépend pas de l'onglet ni du rendu.
const compteur = document.querySelector('[data-counter]');
let faussePendule = 0;
const vraiRaf = window.requestAnimationFrame;
const vraiNow = performance.now.bind(performance);
window.requestAnimationFrame = cb => { faussePendule += 100; cb(faussePendule); };
performance.now = () => faussePendule;

window.animerCompteur(compteur);

window.requestAnimationFrame = vraiRaf;
performance.now = vraiNow;

verifie('le compteur atteint exactement sa cible', compteur.textContent === '128');
verifie('le compteur ne dépasse pas sa cible', Number(compteur.textContent) <= 128);

// Une cible absente ou illisible ne doit pas produire NaN.
const vide = document.createElement('span');
vide.dataset.counter = '';
faussePendule = 0;
window.requestAnimationFrame = cb => { faussePendule += 100; cb(faussePendule); };
performance.now = () => faussePendule;
window.animerCompteur(vide);
window.requestAnimationFrame = vraiRaf;
performance.now = vraiNow;
verifie('une cible vide donne 0, pas NaN', vide.textContent === '0');

// --- Formulaire : protections anti-spam ---
const form = document.getElementById('contact-form');
const statut = document.getElementById('form-status');
const remplir = () => {
  form.nom.value = 'Dupont';
  form.prenom.value = 'Marie';
  form.email.value = 'marie@example.com';
  form.telephone.value = '0612345678';
  form.consentement.checked = true;
};

remplir();
form.requestSubmit();
verifie('un envoi immédiat est refusé (délai minimum)', statut.dataset.erreur === 'oui');

window.horloge = 5000; // au-delà des 3 s exigées
remplir();
form.societe.value = 'robot';
form.requestSubmit();
verifie('le honeypot rempli ne signale rien au robot', statut.dataset.erreur === 'non');
verifie('le honeypot rempli n’envoie pas le formulaire', form.nom.value === '');

remplir();
form.societe.value = '';
form.requestSubmit();
verifie('sans clés EmailJS, l’échec est annoncé et non silencieux',
  statut.dataset.erreur === 'oui' && statut.textContent.includes('06 16 69 92 06'));
verifie('sans clés EmailJS, la saisie de l’utilisateur est conservée', form.nom.value === 'Dupont');

// --- Carrousel de bannière ---
const piste = document.querySelector('#accueil .diapos');
const lecture = document.querySelector('.diapos-controles .lecture');
const pointCourant = () => [...document.querySelectorAll('[data-diapo]')].map(b => b.getAttribute('aria-current')).join(',');

verifie('les deux diapositives sont dans le HTML', document.querySelectorAll('.diapo').length === 2);
verifie('le défilement automatique démarre', carrousel.enLecture());

lecture.click();
verifie('le bouton met le défilement en pause', !carrousel.enLecture());
verifie('le bouton annonce alors la reprise', lecture.textContent.includes('Reprendre'));
lecture.click();
verifie('le bouton relance le défilement', carrousel.enLecture());

document.querySelector('[data-diapo="1"]').click();
verifie('naviguer à la main coupe le défilement automatique', !carrousel.enLecture());

piste.scrollLeft = 200;              // simule la fin du défilement vers la 2e
piste.dispatchEvent(new Event('scroll'));
verifie('le point actif suit la diapositive affichée', pointCourant() === 'false,true');

document.getElementById('resultats').textContent =
  echecs.length ? 'ÉCHECS :\n- ' + echecs.join('\n- ') : 'OK — tous les tests passent';
document.title = echecs.length ? 'ÉCHEC' : 'OK';
</script>
</body>
</html>
